name: Build image

# Builds the patched U-Boot and DTB, the derived overlay, and the installer and
# raw image, then checks every copy of the device trees. Nothing leaves the
# runner except the workflow artifact. ci.yml and release.yml call this file.

"on":
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    # U-Boot builds natively on arm64. No QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services:
      # Imager pulls --overlay-image from a registry. Pull requests push the
      # derived overlay here; nothing is published. Dependabot does not track
      # service images: update the digest by hand.
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5005:5000
    env:
      OVERLAY_IMAGE: 127.0.0.1:5005/talos-rockpi4b-overlay
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install fdtput and mtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler mtools fdisk
          mkdir -p _out/logs
      - name: Patch the external DTB
        id: dtb
        run: scripts/patch-dtb.sh _out/files 2>&1 | tee _out/logs/1-patch-dtb.log
      # Runs before the U-Boot patch and also when the DTB patch fails, so a
      # build that fails because upstream dropped HS400 still shows the warning.
      - name: Check the upstream files
        if: ${{ !cancelled() && steps.dtb.outcome != 'skipped' }}
        run: scripts/upstream-watch.sh _out/files/upstream 2>&1 | tee _out/logs/2-upstream-watch.log
      - name: Build U-Boot
        run: scripts/build-uboot.sh _out/files 2>&1 | tee _out/logs/3-build-uboot.log
      - name: Build the derived overlay
        id: overlay
        run: |
          ref=$(scripts/build-overlay.sh _out/files "$OVERLAY_IMAGE" "ci-$GITHUB_RUN_ID" 2> >(tee _out/logs/4-build-overlay.log >&2))
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
      - name: Build the installer and raw image
        env:
          OVERLAY_REF: ${{ steps.overlay.outputs.ref }}
        run: scripts/build-images.sh "$OVERLAY_REF" _out/images 2>&1 | tee _out/logs/5-build-images.log
      - name: Check the images
        run: scripts/verify-images.sh _out/files _out/images 2>&1 | tee _out/logs/6-verify-images.log
      - name: Upload the outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hs200-image
          retention-days: 7
          if-no-files-found: error
          path: |
            _out/files/u-boot-rockchip.bin
            _out/files/rk3399-rock-pi-4b.dtb
            _out/images/metal-arm64.raw.xz
            _out/images/installer-arm64.tar
            _out/logs/

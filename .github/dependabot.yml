version: 2
updates:
  # The workflows pin each action by commit SHA with a version comment.
  # Dependabot moves both the SHA and the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Talos pin. Only pins/talos.Dockerfile is tracked: `uv run pins sync`
  # derives the overlay pin from it through Image Factory, so /overlay has no
  # entry here.
  - package-ecosystem: "docker"
    directory: "/pins"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
